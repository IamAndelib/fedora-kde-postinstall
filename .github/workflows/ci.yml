name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to catch Fedora/RPM Fusion changes that break the script.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  scenarios:
    name: Lint + hardware scenarios (stubbed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Published checksum matches the script
        run: sha256sum -c fedora-kde-setup.sh.sha256
      - name: shellcheck
        run: shellcheck fedora-kde-setup.sh install.sh tests/*.sh tests/lib/*.sh tests/lib/stub
      - name: Scenario matrix
        run: |
          set -o pipefail
          if ! bash tests/run.sh 2>&1 | tee run.log; then
            # Also show the failures as an annotation on the run's summary page.
            msg=$( { bash --version | head -n1; sudo --version 2>/dev/null | head -n1; sed -n '/^Failures:/,$p' run.log; } | head -n 120) || true
            msg=${msg//'%'/'%25'}
            msg=${msg//$'\r'/}
            msg=${msg//$'\n'/'%0A'}
            echo "::error title=Scenario failures::$msg"
            exit 1
          fi

  fedora:
    name: Real run on Fedora ${{ matrix.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.release == 'rawhide' }}
    strategy:
      fail-fast: false
      matrix:
        release: ["43", "44", "rawhide"]
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.release }}
    steps:
      - uses: actions/checkout@v6
      - name: One-line installer downloads, verifies and starts this commit
        run: |
          FEDORA_KDE_SETUP_REF=${{ github.sha }} bash install.sh --version | tee /tmp/launcher.log
          grep -q 'Download verified' /tmp/launcher.log
          grep -q '^fedora-kde-setup ' /tmp/launcher.log
      - name: Run the script for real and check the result
        run: bash tests/fedora-integration.sh ./fedora-kde-setup.sh
      - name: Upload the script's log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fedora-${{ matrix.release }}-log
          path: /var/log/fedora-kde-setup.log
          if-no-files-found: ignore

  upgrade:
    name: Upgrade from v1.1.0 on Fedora ${{ matrix.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        release: ["43", "44"]
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.release }}
    steps:
      - uses: actions/checkout@v6
      - name: Run v1.1.0, then this version, and check the result
        run: bash tests/upgrade-from-v1.1.sh ./fedora-kde-setup.sh
