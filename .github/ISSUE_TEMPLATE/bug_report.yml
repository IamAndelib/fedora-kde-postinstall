name: Bug report
description: The script failed, misdetected your hardware, or left something not working.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems, please use **Security → Report a vulnerability** instead of a public issue.
  - type: input
    id: version
    attributes:
      label: Script version
      description: Output of `bash fedora-kde-setup.sh --version`
      placeholder: fedora-kde-setup 1.0.0
    validations:
      required: true
  - type: input
    id: fedora
    attributes:
      label: Fedora version and edition
      placeholder: Fedora 44, KDE Plasma Desktop Edition
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware summary and plan
      description: Paste the "Detecting hardware" and "Planned actions" sections from `sudo bash fedora-kde-setup.sh --dry-run --force`.
      render: text
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: The relevant part of `/var/log/fedora-kde-setup.log`, especially the last 50 lines and any `!!` or `xx` lines. **Remove the MOK one-time password line if present.**
      render: text
